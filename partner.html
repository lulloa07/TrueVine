<title>True Vine Mission</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --cream:#F3EFE2; --gold-bright:#E4B04A; }

  *{box-sizing:border-box;}
  html{ background:var(--cream); }
  body{
    margin:0;
    background:var(--cream);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    justify-content:safe center;
    padding:32px 16px;
  }

  .hero-wrap{
    position:relative;
    width:100%;
    max-width:760px;
    margin:0 auto;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 24px 48px rgba(20,35,25,.16);
  }
  .hero-wrap img{ width:100%; height:auto; display:block; }

  .hero-wrap img.hero-mobile{ display:none; }
  .cta-overlay.mobile{ display:none; }

  @media (max-width:560px){
    body{ display:block; min-height:0; padding:10px 16px; }
    .hero-wrap img.hero-desktop{ display:none; }
    .hero-wrap img.hero-mobile{ display:block; }
    .cta-overlay.desktop{ display:none; }
    .cta-overlay.mobile{ display:block; }
  }

  .cta-overlay{
    position:absolute;
    border-radius:4px;
    outline:none;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    transition:background .2s ease;
  }
  .cta-overlay.desktop{ left:5.2%; top:89.0%; width:55.9%; height:8.1%; }
  .cta-overlay.mobile{ left:6.04%; top:89.74%; width:68.84%; height:4.58%; }
  .cta-overlay:hover{ background:rgba(255,255,255,.1); }
  .cta-overlay:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:3px; }
</style>
