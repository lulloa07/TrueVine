<title>The Need — True Vine Mission</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Oswald:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap');

  :root{
    --green:#1B3A2D; --green-deep:#122A20; --green-light:#2E5A45;
    --gold:#C8972A; --gold-bright:#E4B04A;
    --sage:#7FA38A; --sage-deep:#4F7160;
    --cream:#F3EFE2; --paper:#FFFFFF;
    --ink:#1A2A20; --ink-soft:#54685C;
    --ink-on-dark:#F3EFE2; --ink-on-dark-soft:#C9D3CB;
    --rule: rgba(27,58,45,.12); --shadow: rgba(20,35,25,.14);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --cream:#EDE7D4; --paper:#FBF9F1; } }
  :root[data-theme="dark"]{ --cream:#EDE7D4; --paper:#FBF9F1; }

  *{box-sizing:border-box;}
  body{ margin:0; background:var(--cream); color:var(--ink); font-family:'Work Sans', system-ui, sans-serif; }
  a{ color:inherit; }
  .container{ max-width:860px; margin:0 auto; padding-inline:24px; }

  /* vine motif, drawn not photographed */
  .vine{ position:absolute; opacity:.16; pointer-events:none; }

  .topbar{
    background:linear-gradient(155deg, var(--green-light), var(--green) 60%, var(--green-deep));
    color:var(--ink-on-dark);
  }
  .topbar .container{ padding-top:22px; padding-bottom:22px; display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand img{ width:30px; height:30px; border-radius:50%; display:block; }
  .brand span{ font-family:'Oswald', sans-serif; font-weight:600; letter-spacing:.1em; font-size:11.5px; text-transform:uppercase; }
  .back-link{
    font-family:'Oswald', sans-serif; font-weight:500; letter-spacing:.08em; font-size:11px; text-transform:uppercase;
    text-decoration:none; color:var(--ink-on-dark-soft); display:flex; align-items:center; gap:6px; transition:color .2s ease;
  }
  .back-link:hover{ color:var(--gold-bright); }
  .back-link svg{ width:11px; height:11px; }

  .page-hero{
    position:relative;
    background:linear-gradient(160deg, var(--green-light), var(--green) 55%, var(--green-deep));
    color:var(--ink-on-dark);
    overflow:hidden;
  }
  .page-hero .container{ position:relative; z-index:1; padding-top:44px; padding-bottom:64px; }
  .page-hero .eyebrow{
    font-family:'Oswald', sans-serif; font-weight:500; letter-spacing:.24em; font-size:11px; text-transform:uppercase; color:var(--gold-bright);
  }
  .page-hero h1{
    margin:12px 0 0; font-family:'Playfair Display', Georgia, serif; font-weight:700;
    font-size:clamp(30px, 5vw, 44px); line-height:1.1; text-wrap:balance; max-width:20ch;
  }
  .page-hero p.lede{ max-width:52ch; margin:16px 0 0; font-size:15px; line-height:1.65; color:var(--ink-on-dark-soft); }

  .content{ padding:44px 0 24px; }
  .content h2{
    font-family:'Playfair Display', Georgia, serif; font-weight:700; font-size:22px; color:var(--green); margin:0 0 12px;
  }
  .content p{ font-size:14.5px; line-height:1.75; color:var(--ink-soft); margin:0 0 16px; max-width:66ch; }
  .content .quote{
    margin:28px 0; padding:22px 24px; background:var(--paper); border-left:3px solid var(--gold);
    border-radius:4px; box-shadow:0 8px 18px var(--shadow);
  }
  .content .quote p{ margin:0; font-family:'Playfair Display', Georgia, serif; font-style:italic; font-size:17px; color:var(--green); line-height:1.5; }
  .content .quote cite{ display:block; margin-top:8px; font-style:normal; font-family:'Oswald', sans-serif; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); }

  .pillars{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:14px; margin:24px 0; }
  .pillar{ background:var(--paper); border-radius:12px; padding:16px 14px; box-shadow:0 8px 16px var(--shadow); text-align:center; }
  .pillar .icon-chip{ width:34px; height:34px; margin:0 auto 8px; border-radius:9px; display:flex; align-items:center; justify-content:center; }
  .pillar .icon-chip svg{ width:17px; height:17px; }
  .pillar span{ display:block; font-family:'Oswald', sans-serif; font-weight:600; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--green); }
  .accent-green .icon-chip{ background:rgba(27,58,45,.08); color:var(--green); }
  .accent-gold  .icon-chip{ background:rgba(200,151,42,.14); color:var(--gold); }
  .accent-sage  .icon-chip{ background:rgba(127,163,138,.16); color:var(--sage-deep); }

  .tiers{ display:flex; flex-direction:column; gap:10px; margin:24px 0; }
  .tier{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--paper); border-radius:12px; padding:14px 18px; box-shadow:0 6px 14px var(--shadow);
    border-left:4px solid var(--rule);
  }
  .tier.bronze{ border-left-color:#A9702F; }
  .tier.silver{ border-left-color:#8C9AA0; }
  .tier.gold{ border-left-color:var(--gold); }
  .tier.platinum{ border-left-color:var(--green); }
  .tier.inkind{ border-left-color:var(--sage-deep); }
  .tier .tier-name{ font-family:'Playfair Display', Georgia, serif; font-weight:700; font-size:15.5px; color:var(--green); }
  .tier .tier-amt{ font-family:'Oswald', sans-serif; font-weight:600; font-size:13px; letter-spacing:.03em; color:var(--ink); white-space:nowrap; }

  .facts{ display:flex; flex-direction:column; gap:0; margin:24px 0; border-top:1px solid var(--rule); }
  .fact{ display:flex; gap:16px; padding:14px 0; border-bottom:1px solid var(--rule); }
  .fact .fact-label{ font-family:'Oswald', sans-serif; font-weight:600; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); width:38%; flex-shrink:0; }
  .fact .fact-value{ font-size:14px; line-height:1.6; color:var(--ink); }

  .callout{
    margin:28px 0; padding:20px 22px; border-radius:14px;
    background:linear-gradient(155deg, var(--green-light), var(--green) 60%, var(--green-deep));
    color:var(--ink-on-dark);
  }
  .callout h3{ margin:0 0 6px; font-family:'Playfair Display', Georgia, serif; font-size:17px; }
  .callout p{ margin:0; color:var(--ink-on-dark-soft); font-size:13.5px; line-height:1.6; }
  .callout a.btn{
    display:inline-flex; margin-top:14px; padding:10px 18px; border-radius:999px;
    background:var(--gold); color:var(--green-deep); text-decoration:none;
    font-family:'Oswald', sans-serif; font-weight:600; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
  }

  .placeholder-note{
    margin:20px 0; padding:12px 16px; border-radius:10px; background:rgba(200,151,42,.1);
    border:1px dashed rgba(200,151,42,.5); font-size:12px; line-height:1.6; color:var(--ink-soft);
  }
  .placeholder-note b{ color:var(--ink); }

  .page-nav{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:48px; padding:16px 0 56px; border-top:1px solid var(--rule);
  }
  .page-nav a{
    font-family:'Oswald', sans-serif; font-weight:500; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    text-decoration:none; color:var(--ink-soft); display:flex; align-items:center; gap:6px; transition:color .2s ease;
  }
  .page-nav a:hover{ color:var(--green); }
  .page-nav a.next{ margin-left:auto; }
  .page-nav svg{ width:11px; height:11px; }
  .page-nav .menu-link{ font-family:'Oswald', sans-serif; font-weight:600; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--green); text-decoration:none; }

  .image-page{ padding:28px 0 8px; }
  .image-page img{ width:100%; height:auto; display:block; border-radius:14px; box-shadow:0 16px 32px var(--shadow); }
</style>
