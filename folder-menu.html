<title>True Vine Folder Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Oswald:wght@500;600&family=Work+Sans:wght@400;500;600&family=Caveat:wght@600;700&display=swap');

  :root{
    --green:#1B3A2D; --green-deep:#122A20; --green-light:#2E5A45;
    --gold:#C8972A; --gold-bright:#E4B04A;
    --sage:#7FA38A;
    --cream:#F3EFE2; --paper:#FBF8EF; --card:#F7F2E4;
    --ink:#1A2A20; --ink-soft:#5C6B60;
    --ink-on-dark:#F3EFE2; --ink-on-dark-soft:#C9D3CB;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --cream:#EDE7D4; --paper:#F7F3E6; --card:#F2ECDA; } }
  :root[data-theme="dark"]{ --cream:#EDE7D4; --paper:#F7F3E6; --card:#F2ECDA; }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background: radial-gradient(ellipse at 50% -10%, rgba(27,58,45,.08), transparent 55%), var(--cream);
    color:var(--ink);
    font-family:'Work Sans', system-ui, sans-serif;
  }

  .stage{ max-width:1040px; margin:0 auto; padding:36px 20px 64px; }

  .letterhead{ text-align:left; display:flex; flex-direction:row; align-items:center; gap:14px; margin-bottom:30px; }
  .letterhead img{ width:88px; height:88px; border-radius:50%; flex-shrink:0; filter:drop-shadow(0 6px 10px rgba(20,35,25,.22)); }
  .letterhead .letterhead-text{ display:flex; flex-direction:column; gap:4px; }
  .letterhead .eyebrow{ font-family:'Oswald', sans-serif; font-weight:600; letter-spacing:.24em; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; }
  .letterhead h1{ margin:0; font-family:'Playfair Display', Georgia, serif; font-weight:700; font-size:clamp(22px,4vw,28px); color:var(--green); }
  @media (max-width:480px){ .letterhead{ justify-content:center; } }

  .spread{
    display:grid;
    grid-template-columns: 0.85fr 1.15fr;
    gap:22px;
    align-items:stretch;
  }
  @media (max-width:820px){
    .spread{ grid-template-columns:1fr; gap:28px; }
  }

  /* ---------- left: welcome card (designed image) ---------- */
  .welcome-card{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 16px 32px rgba(20,35,25,.12);
    height:100%;
    background:#F9F1E0;
  }
  .welcome-card img{
    width:100%;
    height:auto;
    display:block;
  }
  @media (max-width:820px){
    .welcome-card{ max-width:460px; margin:0 auto; height:auto; }
  }

  /* ---------- right: tab stack ---------- */
  .tabs{ display:flex; flex-direction:column; gap:11px; }
  .tab{
    display:flex; align-items:center; gap:16px;
    padding:17px 20px;
    border-radius:14px;
    text-decoration:none;
    color:var(--ink-on-dark);
    box-shadow:0 12px 22px rgba(20,35,25,.18);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .tab:hover, .tab:focus-visible{ transform:translateX(5px); box-shadow:0 16px 28px rgba(20,35,25,.24); }
  .tab .icon-chip{
    flex-shrink:0; width:36px; height:36px; border-radius:50%;
    background:rgba(255,255,255,.16);
    display:flex; align-items:center; justify-content:center;
  }
  .tab .icon-chip svg{ width:18px; height:18px; }
  .tab .tab-label{ flex:1; font-family:'Playfair Display', Georgia, serif; font-weight:700; font-size:15.5px; }
  .tab .chevron{ width:14px; height:14px; opacity:.8; transition:transform .2s ease; flex-shrink:0; }
  .tab:hover .chevron{ transform:translateX(3px); }
  @media (max-width:820px){
    .tabs{ max-width:460px; margin:0 auto; width:100%; gap:13px; }
    .tab{ padding:19px 22px; }
    .tab .icon-chip{ width:40px; height:40px; }
    .tab .icon-chip svg{ width:20px; height:20px; }
    .tab .tab-label{ font-size:16.5px; }
  }

  /* gradient sweep, dark green at top fading toward gold at the bottom */
  .tab:nth-child(1){ background:linear-gradient(135deg, #2E5A45, #1E4231); }
  .tab:nth-child(2){ background:linear-gradient(135deg, #2C563F, #1E4231); }
  .tab:nth-child(3){ background:linear-gradient(135deg, #3F6247, #2C4C38); }
  .tab:nth-child(4){ background:linear-gradient(135deg, #526A47, #3D5540); }
  .tab:nth-child(5){ background:linear-gradient(135deg, #647047, #4C5B3D); }
  .tab:nth-child(6){ background:linear-gradient(135deg, #77773F, #5F6339); }
  .tab:nth-child(7){ background:linear-gradient(135deg, #8C7C42, #6F5F30); }
  .tab:nth-child(8){ background:linear-gradient(135deg, #9F832F, #816929); }
  .tab:nth-child(9){ background:linear-gradient(135deg, #A9852F, #8A6A23); }
  .tab:nth-child(10){ background:linear-gradient(135deg, #B98A32, #93701F); }

  .footnote{ margin-top:28px; text-align:center; font-size:12px; line-height:1.6; color:var(--ink-soft); }
</style>
